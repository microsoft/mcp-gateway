apiVersion: v1
kind: Namespace
metadata:
  name: "${KUBERNETES_NAMESPACE}"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  namespace: "${KUBERNETES_NAMESPACE}"
type: Opaque
data:
  gatewaySecret: "${GATEWAY_SECRET_BASE64}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpgateway
  namespace: "${KUBERNETES_NAMESPACE}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpgateway
  template:
    metadata:
      labels:
        app: mcpgateway
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: mcpgateway-sa
      containers:
        - name: mcpgateway-container
          image: ${GATEWAY_IMAGE}
          ports:
            - containerPort: 8000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: GatewaySettings__Secret
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: gatewaySecret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcpgateway-service
  namespace: "${KUBERNETES_NAMESPACE}"
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.1.100
  selector:
    app: mcpgateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcpgateway-sa
  namespace: "${KUBERNETES_NAMESPACE}"
  annotations:
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-sa
  namespace: "${KUBERNETES_NAMESPACE}"
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_CLIENT_ID}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-manager
  namespace: "${KUBERNETES_NAMESPACE}"
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "update", "delete", "patch", "watch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-manager-binding
  namespace: "${KUBERNETES_NAMESPACE}"
subjects:
  - kind: ServiceAccount
    name: mcpgateway-sa
    namespace: "${KUBERNETES_NAMESPACE}"
roleRef:
  kind: Role
  name: app-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: "${KUBERNETES_NAMESPACE}"
data:
  Kubernetes__Namespace: "${KUBERNETES_NAMESPACE}"
  AzureAd__Instance: "https://login.microsoftonline.com/"
  AzureAd__TenantId: "${TENANT_ID}"
  AzureAd__ClientId: "${CLIENT_ID}"
  AzureAd__Audience: "${CLIENT_ID}"

  CosmosSettings__AccountEndpoint: "https://mg-storage-${IDENTIFIER}.documents.azure.com:443/"
  CosmosSettings__DatabaseName: "McpGatewayDb"

  ApplicationInsights__ConnectionString: "${APPINSIGHTS_CONNECTION_STRING}"

  ContainerRegistrySettings__Endpoint: "mgreg${IDENTIFIER}.azurecr.io"

  PublicOrigin: "${PUBLIC_ORIGIN}"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: toolgateway
  namespace: "${KUBERNETES_NAMESPACE}"
spec:
  serviceName: toolgateway-service
  replicas: 1
  selector:
    matchLabels:
      app: toolgateway
  template:
    metadata:
      labels:
        app: toolgateway
        azure.workload.identity/use: "true"
        adapter/type: "mcp"
    spec:
      serviceAccountName: mcpgateway-sa
      containers:
        - name: toolgateway-container
          image: ${TOOL_GATEWAY_IMAGE}
          ports:
            - containerPort: 8000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: GatewaySettings__Secret
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: gatewaySecret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: toolgateway-service
  namespace: "${KUBERNETES_NAMESPACE}"
spec:
  clusterIP: "None"
  selector:
    app: toolgateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
# NetworkPolicy: Default deny all ingress in the deployment namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: "${KUBERNETES_NAMESPACE}"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# NetworkPolicy: Allow unrestricted ingress to mcpgateway on port 8000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcpgateway-ingress
  namespace: "${KUBERNETES_NAMESPACE}"
spec:
  podSelector:
    matchLabels:
      app: mcpgateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
---
# NetworkPolicy: Only mcpgateway and toolgateway can reach adapter/tool pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adapter-access
  namespace: "${KUBERNETES_NAMESPACE}"
spec:
  podSelector:
    matchExpressions:
      - key: adapter/type
        operator: In
        values: [mcp, tool]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcpgateway
        - podSelector:
            matchLabels:
              app: toolgateway
      ports:
        - protocol: TCP
          port: 8000
