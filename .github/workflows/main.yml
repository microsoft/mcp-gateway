name: Build and Test Solution

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout source
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '8.x'

    - name: Restore dependencies
      run: dotnet restore dotnet/Microsoft.McpGateway.sln

    - name: Build
      run: dotnet build dotnet/Microsoft.McpGateway.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test dotnet/Microsoft.McpGateway.sln --configuration Release --verbosity normal

  test-mcp-proxy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install --disable-pip-version-check -r sample-servers/mcp-proxy/requirements-dev.txt

    - name: Test MCP proxy
      run: python -m pytest sample-servers/mcp-proxy/tests
