name: Build and Test Solution

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '8.x'

    - name: Restore dependencies
      run: dotnet restore dotnet/Microsoft.McpGateway.sln

    - name: Build
      run: dotnet build dotnet/Microsoft.McpGateway.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test dotnet/Microsoft.McpGateway.sln --configuration Release --verbosity normal

  test-mcp-proxy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install --disable-pip-version-check -r sample-servers/mcp-proxy/requirements-dev.txt

    - name: Test MCP proxy
      run: python -m pytest sample-servers/mcp-proxy/tests

  test-deployment-templates:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Compile Bicep locally
      run: az bicep build --file deployment/infra/azure-deployment.bicep

    - name: Test deployment templates without Azure access
      shell: pwsh
      run: ./deployment/e2e/test-deployment.ps1 -BashPath bash
